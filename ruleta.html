<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ruleta BlueTalk</title>
  <meta name="description" content="Gira la ruleta BlueTalk y descubre tu premio.">
  <meta name="theme-color" content="#1574C1">
  <link rel="icon" href="logo.png">
  <style>
    /* Paleta «celeste» de la app: lib/core/theme/app_colors.dart */
    @font-face {
      font-family: "Nunito";
      src: url("Nunito-Variable.ttf") format("truetype");
      font-weight: 200 1000;
      font-display: swap;
    }
    :root {
      --primary: #1574C1;
      --primary-strong: #0F5E9C;
      --header: #238EE7;
      --accent: #37BEA7;
      --on-accent: #0A3B2E;
      --menta: #BFF3E8;
      --aviso: #FBEBC8;
      --on-aviso: #5B4413;
      --text: #263442;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: #FFFFFF;
      font-family: "Nunito", system-ui, sans-serif;
      font-size: 17px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(700px 360px at 90% 0%, rgb(55 190 167 / .35), transparent 70%),
        radial-gradient(600px 320px at 0% 100%, rgb(35 142 231 / .5), transparent 70%),
        linear-gradient(160deg, var(--primary), var(--primary-strong)) fixed;
      background-color: var(--primary-strong);
    }
    a { color: inherit; }
    .cab { max-width: 1100px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    .cab .logo { height: 38px; width: auto; background: #FFFFFF; border-radius: 10px; padding: 4px 8px; }
    .cab a.volver {
      margin-left: auto; font-weight: 800; text-decoration: none;
      padding: 10px 16px; border-radius: 12px; min-height: 44px; display: inline-flex; align-items: center;
      background: rgb(255 255 255 / .14); border: 1px solid rgb(255 255 255 / .3);
    }
    main {
      max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px;
      display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 40px; align-items: center;
    }

    /* Rueda */
    .ruleta { position: relative; width: min(100%, 560px); aspect-ratio: 1; justify-self: center; }
    .ruleta svg.rueda {
      width: 100%; height: 100%; display: block;
      filter: drop-shadow(0 22px 40px rgb(0 0 0 / .3));
      transition: transform 5.2s cubic-bezier(.12, .7, .1, 1);
    }
    .rueda text { font-family: "Nunito", system-ui, sans-serif; font-weight: 900; font-size: 19px; }
    .puntero {
      position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
      width: 13%; filter: drop-shadow(0 6px 8px rgb(0 0 0 / .3)); z-index: 2;
    }
    .centro {
      position: absolute; inset: 0; margin: auto; width: 30%; height: 30%;
      border-radius: 50%; background: #FFFFFF; border: 6px solid var(--aviso);
      box-shadow: 0 8px 20px rgb(0 0 0 / .25), inset 0 0 0 4px var(--menta);
      display: grid; place-items: center; overflow: hidden;
    }
    .centro img { width: 92%; height: auto; transform: translateY(6%); }
    .girando .centro img { animation: salto .5s ease-in-out infinite alternate; }
    @keyframes salto { to { transform: translateY(0) scale(1.05); } }

    /* Panel */
    .panel h1 { font-size: clamp(2rem, 5.4vw, 3.2rem); line-height: 1.05; margin: 0 0 10px; font-weight: 900; }
    .panel h1 span { color: var(--menta); }
    .panel p.lema { margin: 0 0 24px; font-size: 1.12rem; opacity: .95; }
    .girar {
      font: inherit; font-weight: 900; font-size: 1.35rem; cursor: pointer;
      min-height: 64px; width: 100%; max-width: 360px; padding: 14px 28px; border: 0; border-radius: 18px;
      background: var(--aviso); color: var(--on-aviso);
      box-shadow: 0 8px 0 #E2C98E, 0 18px 30px rgb(0 0 0 / .25);
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .girar:hover { transform: translateY(-2px); }
    .girar:active { transform: translateY(6px); box-shadow: 0 2px 0 #E2C98E, 0 8px 16px rgb(0 0 0 / .25); }
    .girar:focus-visible { outline: 4px solid var(--menta); outline-offset: 4px; }
    .girar:disabled { cursor: default; opacity: .75; transform: none; }

    .resultado {
      margin-top: 26px; display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center;
      background: #FFFFFF; color: var(--text); border-radius: 22px; padding: 14px 20px 14px 10px;
      box-shadow: 0 16px 34px rgb(0 0 0 / .22);
      transform-origin: left center;
    }
    .resultado[hidden] { display: none; }
    .resultado.nuevo { animation: aparece .45s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes aparece { from { transform: scale(.7); opacity: 0; } }
    .resultado img { width: 120px; height: auto; }
    .resultado small { display: block; font-weight: 800; color: var(--primary-strong); text-transform: uppercase; letter-spacing: .06em; font-size: .78rem; }
    .resultado strong { display: block; font-size: clamp(1.5rem, 4vw, 2.1rem); line-height: 1.1; font-weight: 900; }

    .lista { margin: 26px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
    .lista li {
      padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: .9rem;
      background: rgb(255 255 255 / .14); border: 1px solid rgb(255 255 255 / .3);
    }
    .lista li.ganador { background: var(--aviso); color: var(--on-aviso); border-color: var(--aviso); }

    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; gap: 24px; text-align: center; }
      .ruleta { width: min(100%, 420px); }
      .panel p.lema { margin-left: auto; margin-right: auto; }
      .girar { max-width: none; }
      .resultado { text-align: left; grid-template-columns: 90px 1fr; }
      .resultado img { width: 90px; }
      .lista { justify-content: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ruleta svg.rueda { transition-duration: .01s; }
      .girando .centro img, .resultado.nuevo { animation: none; }
    }
  </style>
</head>
<body>
  <header class="cab">
    <img class="logo" src="logo.png" alt="BlueTalk">
    <a class="volver" href="./">Descargar la beta</a>
  </header>

  <main>
    <div class="ruleta" id="ruleta">
      <svg class="puntero" viewBox="0 0 60 70" aria-hidden="true">
        <path d="M30 68 4 14A26 26 0 0 1 56 14Z" fill="#FBEBC8" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="30" cy="22" r="8" fill="#1574C1"/>
      </svg>
      <svg class="rueda" id="rueda" viewBox="0 0 400 400" role="img" aria-label="Ruleta con los premios"></svg>
      <div class="centro" aria-hidden="true"><img src="mascota-ruleta.png" alt=""></div>
    </div>

    <div class="panel">
      <h1>Ruleta <span>BlueTalk</span></h1>
      <p class="lema">Gira la ruleta y descubre tu premio.</p>
      <button class="girar" id="girar" type="button">¡Girar la ruleta!</button>

      <div class="resultado" id="resultado" hidden aria-live="polite">
        <img src="mascota-premio.png" width="120" height="130" alt="">
        <div><small>¡Te tocó!</small><strong id="premio"></strong></div>
      </div>

      <ul class="lista" id="lista" aria-label="Premios"></ul>
    </div>
  </main>

  <script>
    // Premios: edita solo esta lista (el orden es el de la rueda, en sentido horario).
    var PREMIOS = ['Premio 1', 'Premio 2', 'Premio 3', 'Premio 4', 'Premio 5',
                   'Premio 6', 'Premio 7', 'Premio 8', 'Premio 9', 'Premio 10'];
    // Relleno y texto de cada casilla (contraste AA del texto sobre su fondo).
    var COLORES = [
      ['#1574C1', '#FFFFFF'], ['#37BEA7', '#0A3B2E'], ['#0F5E9C', '#FFFFFF'], ['#BFF3E8', '#0F5E9C'],
      ['#238EE7', '#061A2E'], ['#FBEBC8', '#5B4413'], ['#1574C1', '#FFFFFF'], ['#37BEA7', '#0A3B2E'],
      ['#0F5E9C', '#FFFFFF'], ['#BFF3E8', '#0F5E9C']
    ];
    var VUELTAS = 6;

    var N = PREMIOS.length, PASO = 360 / N, C = 200, R = 188;
    var rueda = document.getElementById('rueda');
    var boton = document.getElementById('girar');
    var caja = document.getElementById('resultado');
    var ruleta = document.getElementById('ruleta');
    var lista = document.getElementById('lista');
    var giro = 0, girando = false;

    function mod(a, b) { return ((a % b) + b) % b; }
    // Ángulo en grados, en sentido horario desde arriba.
    function punto(ang, r) {
      var rad = ang * Math.PI / 180;
      return (C + r * Math.sin(rad)).toFixed(2) + ' ' + (C - r * Math.cos(rad)).toFixed(2);
    }
    // Casilla que queda bajo el puntero (arriba) con la rueda girada `rot` grados.
    function casillaBajoPuntero(rot) { return Math.floor(mod(-rot, 360) / PASO); }

    function dibujar() {
      var ns = 'http://www.w3.org/2000/svg', html = '';
      html += '<circle cx="200" cy="200" r="198" fill="#FFFFFF"/>';
      PREMIOS.forEach(function (nombre, i) {
        var col = COLORES[i % COLORES.length], a = i * PASO, medio = a + PASO / 2;
        html += '<path d="M200 200L' + punto(a, R) + 'A' + R + ' ' + R + ' 0 0 1 ' + punto(a + PASO, R) +
                'Z" fill="' + col[0] + '" stroke="#FFFFFF" stroke-width="2"/>';
        html += '<text x="' + (C + R * 0.6) + '" y="' + C + '" fill="' + col[1] +
                '" text-anchor="middle" dominant-baseline="central" transform="rotate(' + (medio - 90) +
                ' 200 200)"></text>';
      });
      for (var i = 0; i < N * 2; i++) {
        var p = punto(i * PASO / 2, 194).split(' ');
        html += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.2" fill="' + (i % 2 ? '#FBEBC8' : '#FFFFFF') + '"/>';
      }
      rueda.innerHTML = html;
      // textContent: los nombres de premio nunca se interpretan como HTML.
      rueda.querySelectorAll('text').forEach(function (t, i) { t.textContent = PREMIOS[i]; });
      PREMIOS.forEach(function (nombre) {
        var li = document.createElement('li');
        li.textContent = nombre;
        lista.appendChild(li);
      });
    }

    function azar(max) {
      var u = new Uint32Array(1);
      (window.crypto || window.msCrypto).getRandomValues(u);
      return u[0] / 4294967296 * max;
    }

    function girar() {
      if (girando) return;
      girando = true;
      boton.disabled = true;
      caja.hidden = true;
      lista.querySelectorAll('.ganador').forEach(function (li) { li.classList.remove('ganador'); });
      ruleta.classList.add('girando');

      var ganador = Math.floor(azar(N));
      var holgura = (azar(1) - 0.5) * PASO * 0.7;  // no cae justo en el centro de la casilla
      var centro = ganador * PASO + PASO / 2;
      giro = giro - mod(giro, 360) + 360 * VUELTAS + mod(-centro - holgura, 360);
      rueda.style.transform = 'rotate(' + giro + 'deg)';

      var hecho = false;
      function fin() {
        if (hecho) return;
        hecho = true;
        var i = casillaBajoPuntero(giro);
        document.getElementById('premio').textContent = PREMIOS[i];
        lista.children[i].classList.add('ganador');
        caja.hidden = false;
        caja.classList.remove('nuevo'); void caja.offsetWidth; caja.classList.add('nuevo');
        ruleta.classList.remove('girando');
        boton.disabled = false;
        boton.textContent = '¡Girar otra vez!';
        girando = false;
      }
      rueda.addEventListener('transitionend', fin, { once: true });
      setTimeout(fin, 6000);  // por si el navegador no emite transitionend
    }

    // Autocomprobación: el giro calculado deja cada casilla bajo el puntero.
    (function () {
      for (var k = 0; k < N; k++) {
        for (var h = -0.35; h <= 0.35; h += 0.35) {
          var g = 1234.5 - mod(1234.5, 360) + 360 * VUELTAS + mod(-(k * PASO + PASO / 2) - h * PASO, 360);
          console.assert(casillaBajoPuntero(g) === k, 'Ruleta: la casilla ' + k + ' no cae bajo el puntero');
        }
      }
    })();

    dibujar();
    boton.addEventListener('click', girar);
  </script>
</body>
</html>
